[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caixa"
version = "0.1.0"
description = "An open-source digital-legacy box: collect, preserve and pass on a digital life."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tony Knight" }]
dependencies = ["chattr"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "mypy>=1.10"]

[project.scripts]
caixa = "caixa.cli:main"

[project.entry-points."caixa.collectors"]
chattr = "caixa.collectors.chattr:collectors"

[tool.setuptools.packages.find]
where = ["."]
include = ["caixa*"]

[tool.setuptools.package-data]
caixa = ["data/dsh/package.json", "data/dsh/package-lock.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["caixa"]

# Chattr's legacy code is type-checked against a baseline (decision in ticket
# 20261101-04): real type errors are reported, missing annotations are not yet.
# Later tickets ratchet this towards strict; Caixa's own code stays strict.
[[tool.mypy.overrides]]
module = ["chattr", "chattr.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests", "tools/chattr/tests"]
addopts = "-ra --import-mode=importlib"

# Third-party libraries without type information.
[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*", "vobject", "vobject.*", "ffmpeg", "ffmpeg.*", "pillow_heif", "faster_whisper"]
ignore_missing_imports = true
